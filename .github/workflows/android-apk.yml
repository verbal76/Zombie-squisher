name: Android APK (GitHub Runner)

on:
  push:
    branches: [main, 'ccr-**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Bundle check
        run: CI=1 npx expo export --platform android --output-dir /tmp/export
      - name: Generate native project
        run: CI=1 npx expo prebuild --platform android --no-install
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Name and verify APK
        id: apk
        run: |
          set -euo pipefail
          OUT=$(node tools/apk-name.js android/app/build/outputs/apk/release/app-release.apk dist)
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT" .apk)" >> "$GITHUB_OUTPUT"
          VC=$(node -p "require('./app.json').expo.android.versionCode")
          VN=$(node -p "require('./app.json').expo.version")
          tools/verify-apk.sh "$OUT" com.hotatticgames.zombiecrusher "$VC" "$VN"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "Source SHA: $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
