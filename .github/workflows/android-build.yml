name: Android APK (GitHub Runner)

# Auto-fires only when a change actually requires a native rebuild — package
# deps, app config, build config, native plugin changes. JS-only edits to
# src/** go through the OTA workflow instead so we never duplicate delivery.

on:
  push:
    branches:
      - 'Github-build-pipeline-zombie-crusher'
    paths-ignore:
      - 'src/**'
      - 'agentic docs/**'
      - '**/*.md'
      - '.github/workflows/eas-update.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (preview = APK, production = AAB)'
        required: true
        default: 'preview'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK on GitHub runner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.ZOMBIE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.ZOMBIE }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare icon assets
        run: npm run prepare-assets

      - name: Determine profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "outext=aab" >> "$GITHUB_OUTPUT"
          else
            echo "profile=${{ github.event.inputs.profile || 'preview' }}" >> "$GITHUB_OUTPUT"
            echo "outext=apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with EAS (local)
        env:
          EXPO_TOKEN: ${{ secrets.ZOMBIE }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.profile }} \
            --local \
            --non-interactive \
            --output build/zombie-squisher.${{ steps.profile.outputs.outext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zombie-squisher-${{ steps.profile.outputs.profile }}-${{ github.run_number }}
          path: build/zombie-squisher.${{ steps.profile.outputs.outext }}
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/zombie-squisher.${{ steps.profile.outputs.outext }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('APK build #{0}', github.run_number) }}"
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
