name: Android APK (GitHub Runner)

on:
  push:
    branches:
      - 'Github-build-pipeline-zombie-crusher'
    paths-ignore:
      - 'src/**'
      - 'agentic docs/**'
      - '**/*.md'
      - '.github/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (preview = APK, production = AAB)'
        required: true
        default: 'preview'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # APK lane: build, verify (identity / signer / 16 KB), smoke-test on an emulator, name <Game>-v<version>.apk.
  apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event.inputs.profile || 'preview') != 'production' }}
    uses: ./.github/workflows/build-apk.yml
    with:
      profile: preview
    secrets:
      EXPO_TOKEN: ${{ secrets.ZOMBIE }}

  release-apk:
    needs: apk
    # Only the authoritative pipeline branch may publish a release (a manual dispatch from any other branch builds only).
    if: ${{ github.ref == 'refs/heads/Github-build-pipeline-zombie-crusher' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artifact_name }}
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ format('apk-build-{0}', github.run_number) }}
          # Without this the new tag lands on the DEFAULT branch head, not the built commit (all apk-build-* tags before 77 do).
          target_commitish: ${{ github.sha }}
          name: "${{ format('{0} (build {1})', needs.apk.outputs.artifact_name, github.run_number) }}"
          prerelease: false
          make_latest: "true"
          generate_release_notes: true

  # Production lane (v* tags or manual dispatch with profile=production): store bundle (AAB).
  aab:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.profile == 'production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.ZOMBIE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source must be on the authoritative pipeline branch
        run: |
          git fetch origin Github-build-pipeline-zombie-crusher
          git merge-base --is-ancestor "$GITHUB_SHA" origin/Github-build-pipeline-zombie-crusher \
            || { echo "::error::$GITHUB_SHA is not part of Github-build-pipeline-zombie-crusher; refusing to build a store bundle from it"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on the runner image; accept licences so Gradle can fetch build-tools/NDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" | tail -3
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.ZOMBIE }}
      - run: npm ci
      - run: npm run check
      - run: node scripts/write-build-info.mjs
      - run: npm run prepare-assets
      - name: Build production bundle with EAS (local)
        run: |
          mkdir -p build
          eas build --platform android --profile production --local --non-interactive --output build/raw.aab
      - name: Name bundle
        id: name
        run: |
          NAME=$(node -p "require('./tools/apk-name.js').apkFileName(require('./app.json').expo).replace(/\.apk$/, '.aab')")
          mv build/raw.aab "build/$NAME"
          echo "file=build/$NAME" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.file }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
