name: Android Candidate APK

# Builds an owner-testable APK from a working branch. It does not publish a release or an OTA.
# MANUAL ONLY (Actions budget policy, see CLAUDE.md): never on push. Dispatch it when an APK is actually needed.
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Also run the emulator smoke test (~5 min extra)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    uses: ./.github/workflows/build-apk.yml
    with:
      profile: preview
      run_smoke: ${{ inputs.smoke }}
    secrets:
      EXPO_TOKEN: ${{ secrets.ZOMBIE }}
