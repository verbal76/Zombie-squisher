name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (development | preview | production)'
        required: true
        default: 'preview'
      platform:
        description: 'Platform (android | ios | all)'
        required: true
        default: 'android'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ github.event.inputs.platform || 'all' }} (${{ github.event.inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Trigger EAS build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          eas build --non-interactive --no-wait --profile "$PROFILE" --platform "$PLATFORM"
