name: EAS Update (OTA)

on:
  push:
    branches:
      - 'Github-build-pipeline-zombie-crusher'
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'eas.json'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update channel/branch (preview | production)'
        required: true
        default: 'preview'
      message:
        description: 'Update message'
        required: false
        default: ''

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Prepare icon assets
        run: npm run prepare-assets

      - name: Publish update
        run: |
          BRANCH="${{ github.event.inputs.branch || 'preview' }}"
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="$(git log -1 --pretty=%B | head -n1)"
          fi
          eas update --non-interactive --branch "$BRANCH" --message "$MSG"
