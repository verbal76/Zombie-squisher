name: EAS Update (OTA)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'eas.json'
      - 'app.json'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Update channel/branch (production | preview | development)'
        required: true
        default: 'production'
      message:
        description: 'Update message'
        required: false
        default: ''

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish update
        run: |
          BRANCH="${{ github.event.inputs.branch || 'production' }}"
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="$(git log -1 --pretty=%B | head -n1)"
          fi
          eas update --non-interactive --branch "$BRANCH" --message "$MSG"
