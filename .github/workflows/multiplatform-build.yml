name: Multiplatform build (Android + Windows + Linux)

# MANUAL ONLY and DEVELOPMENT ONLY. One immutable source SHA (the commit of the ref this run is dispatched on) is
# validated once, then built for each selected platform, and a final job refuses to succeed unless every manifest
# names that same SHA. It publishes NOTHING: no GitHub Release, no OTA, no Steam, no Google Play. Artifacts live on
# the run for owner testing (14 days). Costs hosted minutes: dispatch it only when builds are actually needed.
on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build the Android APK (EAS local build, ~9 min)'
        type: boolean
        default: true
      windows:
        description: 'Build the Windows x64 ZIP (cross-packaged on Linux, ~3 min)'
        type: boolean
        default: true
      linux:
        description: 'Build the Linux x86-64 TAR.GZ and smoke-test it under Xvfb (~5 min)'
        type: boolean
        default: true
      android_smoke:
        description: 'Android emulator smoke test (~5 min extra)'
        type: boolean
        default: false
      windows_smoke:
        description: 'Run the Windows build on a windows-latest runner (billed at 2x, ~5 min)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: multiplatform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.id.outputs.sha }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: id
        run: |
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "Source for every platform in this run: $GITHUB_SHA ($GITHUB_REF)"
      - run: npm ci
      - name: Shared gameplay, input, provenance and authorization tests (once, for all platforms)
        run: npm run check

  android:
    needs: source
    if: ${{ inputs.android }}
    uses: ./.github/workflows/build-apk.yml
    with:
      profile: preview
      run_smoke: ${{ inputs.android_smoke }}
    secrets:
      EXPO_TOKEN: ${{ secrets.ZOMBIE }}

  desktop:
    needs: source
    if: ${{ inputs.windows || inputs.linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Build Linux x86-64 (tar.gz)
        if: ${{ inputs.linux }}
        run: |
          node desktop/build.mjs --platform linux --out dist-linux
          node tools/verify-desktop-package.js dist-linux/*.tar.gz linux dist-linux/*.tar.gz.sha256
      - name: Smoke-test the packaged Linux build (menus, gamepad, play, pause, focus loss, saves, restart, clean quit)
        if: ${{ inputs.linux }}
        run: |
          set -e
          mkdir -p smoke-linux x && tar -xzf dist-linux/*.tar.gz -C x
          D=$(ls -d x/*/)
          (xvfb-run -a -s "-screen 0 1280x800x24" env HAG_SOFTWARE_GL=1 "$D/ZombieSquisher.sh" --remote-debugging-port=9222 --windowed > smoke-linux/electron.log 2>&1 &)
          for i in $(seq 1 60); do curl -s http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          node tools/desktop-smoke.mjs --cdp http://127.0.0.1:9222 --out smoke-linux
          sleep 3; pkill -f "[z]ombie-squisher-bin" || true
          node tools/desktop-restart-test.mjs --dist "$D" --home "$RUNNER_TEMP/restart-home"
      - name: Build Windows x64 (zip, cross-packaged; executable resources branded with resedit)
        if: ${{ inputs.windows }}
        run: |
          node desktop/build.mjs --platform win32 --out dist-windows
          node tools/verify-desktop-package.js dist-windows/*.zip windows dist-windows/*.zip.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.linux }}
        with:
          name: ZombieSquisher-linux
          path: dist-linux/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.windows }}
        with:
          name: ZombieSquisher-windows
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && inputs.linux
        with:
          name: smoke-linux-${{ github.run_number }}
          path: smoke-linux/
          retention-days: 14

  windows-smoke:
    needs: desktop
    if: ${{ inputs.windows && inputs.windows_smoke }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ZombieSquisher-windows
          path: dist-windows
      - name: Run ZombieSquisher.exe and drive it (menus, gamepad, play, pause, focus loss)
        env:
          HAG_SOFTWARE_GL: '1'
        run: |
          mkdir -p smoke-windows x && unzip -q dist-windows/*.zip -d x
          D=$(ls -d x/*/)
          ("$D/ZombieSquisher.exe" --remote-debugging-port=9222 --windowed > smoke-windows/electron.log 2>&1 &)
          for i in $(seq 1 60); do curl -s http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          node tools/desktop-smoke.mjs --cdp http://127.0.0.1:9222 --out smoke-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows-${{ github.run_number }}
          path: smoke-windows/
          retention-days: 14

  verify:
    # Refuses to succeed unless every platform built in this run came from the SAME commit.
    needs: [source, android, desktop]
    if: ${{ always() && needs.source.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Same source SHA, same digests, requested platforms present
        env:
          WANT_ANDROID: ${{ inputs.android }}
          WANT_WINDOWS: ${{ inputs.windows }}
          WANT_LINUX: ${{ inputs.linux }}
        run: |
          REQ=""
          [ "$WANT_ANDROID" = "true" ] && REQ="$REQ,android"
          [ "$WANT_WINDOWS" = "true" ] && REQ="$REQ,windows"
          [ "$WANT_LINUX" = "true" ] && REQ="$REQ,linux"
          node tools/verify-same-source.js "${{ needs.source.outputs.sha }}" release-manifest.json parts --require "${REQ#,}"
          cat release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.run_number }}
          path: release-manifest.json
          retention-days: 14
