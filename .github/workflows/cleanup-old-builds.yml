name: Cleanup old releases + artifacts

on:
  workflow_run:
    workflows: ["Android APK (GitHub Runner)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of most-recent releases/artifacts to retain'
        required: true
        default: '3'

permissions:
  contents: write   # delete releases + tags
  actions: write    # delete workflow artifacts

concurrency:
  group: cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune old APK releases and workflow artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete old apk-build-* releases (keep latest N)
        uses: actions/github-script@v7
        env:
          KEEP: ${{ github.event.inputs.keep || '3' }}
        with:
          script: |
            const keep = parseInt(process.env.KEEP, 10);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            // Only auto-prune our APK build releases; never touch tagged production releases (v*).
            const apkReleases = releases
              .filter(r => /^apk-build-\d+$/.test(r.tag_name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = apkReleases.slice(keep);
            core.info(`Found ${apkReleases.length} apk-build-* releases. Keeping ${keep}, deleting ${toDelete.length}.`);
            for (const r of toDelete) {
              core.info(`Deleting release ${r.tag_name} (id=${r.id})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: r.id,
              });
              // Also delete the tag so it doesn't linger on the repo.
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${r.tag_name}`,
                });
                core.info(`  -> tag ${r.tag_name} deleted`);
              } catch (e) {
                core.info(`  -> tag ${r.tag_name} delete skipped: ${e.message}`);
              }
            }

      - name: Delete old workflow artifacts (keep latest N)
        uses: actions/github-script@v7
        env:
          KEEP: ${{ github.event.inputs.keep || '3' }}
        with:
          script: |
            const keep = parseInt(process.env.KEEP, 10);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            // Sort newest first.
            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = artifacts.slice(keep);
            core.info(`Found ${artifacts.length} artifacts. Keeping ${keep}, deleting ${toDelete.length}.`);
            for (const a of toDelete) {
              core.info(`Deleting artifact ${a.name} (id=${a.id}, size=${a.size_in_bytes}b)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }
